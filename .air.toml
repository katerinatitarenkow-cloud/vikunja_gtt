root = "."
tmp_dir = "tmp"

[build]
cmd = 'go build -trimpath "-tags=osusergo,netgo" "-o=./tmp/vikunja-dev.exe" .'
entrypoint = ["tmp\\vikunja-dev.exe", "web"]

include_ext = ["go"]

exclude_dir = [
    "frontend",
    "release",
    "database",
    "data",
    "tmp",
    ".git",
    "node_modules"
]

delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true
